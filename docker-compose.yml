version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: stocksense-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: stocksense
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stocksense-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/stocksense
      - JWT_SECRET=stocksense_prod_ultra_secure_jwt_secret_2026
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stocksense-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
